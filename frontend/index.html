<!DOCTYPE html>
<html lang="pt-BR" class="transition-colors duration-200">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Acervo de Partituras</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col">

    <header class="bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-slate-200 dark:border-slate-700 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-blue-600 flex items-center justify-center text-white shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-music text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg leading-tight">Acervo de Partituras</h1>
                    <p class="text-xs text-slate-500 dark:text-slate-400">Organizador Pessoal</p>
                </div>
            </div>

            <div class="flex items-center space-x-3">
                <button id="themeToggleBtn" onclick="toggleDarkMode()" title="Alternar Tema" class="p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 transition">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
                <button onclick="openModal('addModal')" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2.5 rounded-lg shadow-md shadow-blue-500/20 flex items-center space-x-2 font-medium text-sm transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>Nova Partitura</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full">
        <div class="bg-white dark:bg-slate-800 rounded-2xl p-4 shadow-sm border border-slate-200 dark:border-slate-700 mb-8 flex items-center">
            <i class="fa-solid fa-magnifying-glass text-slate-400 ml-2 mr-3"></i>
            <input type="text" id="searchInput" placeholder="Buscar por título ou compositor..." class="w-full bg-transparent focus:outline-none text-sm">
        </div>

        <div id="sheetsGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Cards gerados via JS -->
        </div>
    </main>

    <!-- MODAL: Adicionar Partitura -->
    <div id="addModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700">
            <div class="flex justify-between items-center pb-3 border-b border-slate-100 dark:border-slate-700 mb-4">
                <h3 class="text-lg font-bold">Nova Partitura (Upload)</h3>
                <button onclick="closeModal('addModal')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <form id="addSheetForm" onsubmit="handleAddSheet(event)" class="space-y-4">
                <input type="text" id="addTitle" required placeholder="Título da Música" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <input type="text" id="addComposer" required placeholder="Compositor" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                <input type="text" id="addInstrument" required placeholder="Instrumento (Ex: Piano, Violão)" class="w-full px-4 py-2 rounded-xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-900 focus:ring-2 focus:ring-blue-500 outline-none text-sm">
                
                <div>
                    <label class="block text-xs font-semibold text-slate-500 mb-1">Ficheiro (PDF ou Foto)</label>
                    <input type="file" id="addFile" accept=".pdf, image/*" required class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
                </div>

                <div class="flex justify-end space-x-3 pt-3 border-t border-slate-100 dark:border-slate-700">
                    <button type="button" onclick="closeModal('addModal')" class="px-4 py-2 rounded-xl text-sm font-medium hover:bg-slate-100 dark:hover:bg-slate-700 transition">Cancelar</button>
                    <button type="submit" id="submitBtn" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-sm font-medium transition">Salvar Ficheiro</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
